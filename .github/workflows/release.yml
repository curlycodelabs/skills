name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release every changed plugin
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install release tooling
        run: npm ci

      - name: Install package dependencies
        run: |
          for unit in $(node scripts/release/units.mjs); do
            if [ -f "$unit/package-lock.json" ]; then
              npm ci --prefix "$unit"
            fi
          done

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for unit in $(node scripts/release/units.mjs); do
            echo "::group::$unit"
            RELEASE_UNIT="$unit" npx semantic-release
            echo "::endgroup::"
          done
